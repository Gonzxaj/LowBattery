# Flatpak / Flathub. Local build (from the repo root):
#   installer/flatpak/gen-sources.sh
#   flatpak-builder --user --install --force-clean build-flatpak installer/flatpak/io.github.gonzxaj.LowBattery.yml
# For Flathub, copy this file and cargo-sources.json to the flathub/io.github.gonzxaj.LowBattery
# repo and replace the `dir` source with the commented `git` one (tag + commit).
id: io.github.gonzxaj.LowBattery
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: lowbattery
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # /dev/hidraw* for SteelSeries and Razer; the host still needs the udev rule
  # (installer/linux/70-lowbattery.rules). /sys/class/power_supply is readable by default.
  - --device=all
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/lowbattery/cargo
modules:
  - name: lowbattery
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --locked -p lowbattery
      - install -Dm755 target/release/lowbattery -t /app/bin
      - install -Dm644 installer/linux/io.github.gonzxaj.LowBattery.desktop -t /app/share/applications
      - install -Dm644 installer/linux/io.github.gonzxaj.LowBattery.metainfo.xml -t /app/share/metainfo
      - install -Dm644 assets/emblem-tile.png /app/share/icons/hicolor/256x256/apps/io.github.gonzxaj.LowBattery.png
    sources:
      - type: dir
        path: ../..
        skip: [target, .cache, dist, build-flatpak, .flatpak-builder]
      # - type: git
      #   url: https://github.com/Gonzxaj/LowBattery.git
      #   tag: v0.1.2
      #   commit: <sha of the tag>
      - cargo-sources.json
