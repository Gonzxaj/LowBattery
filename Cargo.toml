[workspace]
resolver = "2"
members = ["crates/battery-core", "crates/app"]
exclude = ["third_party"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Third-party deps (tiny-skia, fonts, taffy) optimized even in dev builds.
[profile.dev.package."*"]
opt-level = 2

# shortcut: patched creamui-render 0.3.0 (restore-from-minimize repaint fix, see
# third_party/README.md); drop when a creamui release ships the upstream fix.
[patch.crates-io]
creamui-render = { path = "third_party/creamui-render" }
# shortcut: patched creamui-platform 0.3.0 (Wayland app_id via set_app_id, see
# third_party/README.md); drop when a creamui release can name the app.
creamui-platform = { path = "third_party/creamui-platform" }
