[workspace]
resolver = "2"
members = ["crates/battery-core", "crates/app"]
exclude = ["third_party"]

[workspace.package]
version = "0.1.4"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Third-party deps (tiny-skia, fonts, taffy) optimized even in dev builds.
[profile.dev.package."*"]
opt-level = 2

# creamui from GitHub main (newer than the 0.3.0 release, same version number),
# with our two patched crates swapped in. See third_party/README.md.
# shortcut: pinned to an unreleased commit; go back to crates.io once a release
# includes upstream's restore repaint, Wayland resize and app_id fixes (PRs #4-#6)
# plus what we still carry (Moved event, native handles).
[patch.crates-io]
creamui = { git = "https://github.com/sammwyy/creamui", rev = "cbc63b9c10d7a68171b6c91af23c7433439b664a" }
creamui-core = { git = "https://github.com/sammwyy/creamui", rev = "cbc63b9c10d7a68171b6c91af23c7433439b664a" }
creamui-fonts = { git = "https://github.com/sammwyy/creamui", rev = "cbc63b9c10d7a68171b6c91af23c7433439b664a" }
creamui-image = { git = "https://github.com/sammwyy/creamui", rev = "cbc63b9c10d7a68171b6c91af23c7433439b664a" }
creamui-reactive = { git = "https://github.com/sammwyy/creamui", rev = "cbc63b9c10d7a68171b6c91af23c7433439b664a" }
creamui-theme = { git = "https://github.com/sammwyy/creamui", rev = "cbc63b9c10d7a68171b6c91af23c7433439b664a" }
creamui-widgets = { git = "https://github.com/sammwyy/creamui", rev = "cbc63b9c10d7a68171b6c91af23c7433439b664a" }
creamui-render = { path = "third_party/creamui-render" }
creamui-platform = { path = "third_party/creamui-platform" }

# Inside the creamui repo the crates depend on each other by path; this makes
# them use our patched copies too.
[patch."https://github.com/sammwyy/creamui"]
creamui-render = { path = "third_party/creamui-render" }
creamui-platform = { path = "third_party/creamui-platform" }
