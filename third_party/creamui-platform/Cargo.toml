[package]
edition = "2021"
name = "creamui-platform"
version = "0.3.0"
authors = ["Sammwy"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Window, event, and native-surface abstraction for CreamUI"
homepage = "https://github.com/sammwyy/creamui"
readme = false
keywords = [
    "gui",
    "windowing",
    "wayland",
    "x11",
]
categories = ["gui"]
license = "Apache-2.0"
repository = "https://github.com/sammwyy/creamui"

[features]
android = [
    "winit-adapter",
    "winit/android-native-activity",
]
blur-blair = [
    "wayland",
    "dep:wayland-backend",
    "dep:wayland-scanner",
]
blur-kwin = [
    "wayland",
    "dep:wayland-protocols-plasma",
]
default = [
    "winit-adapter",
    "desktop",
]
desktop = [
    "winit/x11",
    "winit/wayland",
    "winit/wayland-dlopen",
    "winit/wayland-csd-adwaita",
]
wayland = [
    "dep:smithay-client-toolkit",
    "dep:wayland-client",
    "dep:wayland-protocols-wlr",
    "dep:xkbcommon",
]
window-integration-blair = [
    "wayland",
    "dep:wayland-backend",
    "dep:wayland-scanner",
]
windows = ["winit-adapter"]
winit-adapter = [
    "dep:winit",
    "winit/rwh_06",
]
x11 = [
    "winit-adapter",
    "winit/x11",
]

[lib]
name = "creamui_platform"
path = "src/lib.rs"

[dependencies.log]
version = "0.4"

[dependencies.raw-window-handle]
version = "0.6"

[dependencies.smithay-client-toolkit]
version = "0.19"
optional = true

[dependencies.wayland-backend]
version = "0.3"
optional = true

[dependencies.wayland-client]
version = "0.31"
features = ["system"]
optional = true

[dependencies.wayland-protocols-plasma]
version = "0.3"
features = ["client"]
optional = true

[dependencies.wayland-protocols-wlr]
version = "0.3"
features = ["client"]
optional = true

[dependencies.wayland-scanner]
version = "0.31"
optional = true

[dependencies.winit]
version = "0.30"
features = ["rwh_06"]
optional = true
default-features = false

[dependencies.xkbcommon]
version = "0.8"
optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen]
version = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "CssStyleDeclaration",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "Node",
    "Window",
]

[target.'cfg(target_arch = "wasm32")'.dependencies.web-time]
version = "1"

[target.'cfg(target_os = "android")'.dependencies.jni]
version = "0.22"

[target.'cfg(target_os = "linux")'.dev-dependencies.wayland-protocols]
version = "0.32"
features = ["server"]

[target.'cfg(target_os = "linux")'.dev-dependencies.wayland-server]
version = "0.31"

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[target."cfg(unix)".dependencies.libc]
version = "0.2"
