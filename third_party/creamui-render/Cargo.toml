[package]
edition = "2021"
name = "creamui-render"
version = "0.3.0"
authors = ["Sammwy"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Rendering backend for CreamUI"
homepage = "https://github.com/sammwyy/creamui"
readme = "README.md"
keywords = [
    "gui",
    "ui",
    "rendering",
    "wgpu",
]
categories = ["gui"]
license = "Apache-2.0"
repository = "https://github.com/sammwyy/creamui"

[features]
context-menu = ["dep:creamui-widgets"]
default = [
    "gpu",
    "platform-winit",
]
gpu = [
    "dep:wgpu",
    "dep:pollster",
    "dep:bytemuck",
]
logger = ["dep:env_logger"]
perf-metrics = [
    "creamui-core/perf-metrics",
    "dep:tracing",
]
platform-android = ["creamui-platform/android"]
platform-blur-blair = ["creamui-platform/blur-blair"]
platform-blur-kwin = ["creamui-platform/blur-kwin"]
platform-wayland = ["creamui-platform/wayland"]
platform-window-integration-blair = ["creamui-platform/window-integration-blair"]
platform-windows = ["creamui-platform/windows"]
platform-winit = [
    "creamui-platform/winit-adapter",
    "creamui-platform/desktop",
]
platform-x11 = ["creamui-platform/x11"]
router = ["dep:creamui-router"]
system-theme = [
    "dep:creamui-theme-loader",
    "creamui-theme-loader/portal",
    "dep:creamui-theme-watch",
    "dep:creamui-appearance",
    "creamui-appearance/portal",
]
tray = [
    "dep:creamui-tray",
    "creamui-tray/linux-status-notifier",
]

[lib]
name = "creamui_render"
path = "src/lib.rs"

[[example]]
name = "retained_window"
path = "examples/retained_window.rs"

[[test]]
name = "context_menu"
path = "tests/context_menu.rs"

[dependencies.bytemuck]
version = "1"
features = ["derive"]
optional = true

[dependencies.creamui-appearance]
version = "0.3.0"
