[dependencies.creamui-core]
version = "0.3.0"

[dependencies.creamui-fonts]
version = "0.3.0"

[dependencies.creamui-platform]
version = "0.3.0"
default-features = false

[dependencies.creamui-reactive]
version = "0.3.0"

[dependencies.creamui-router]
version = "0.3.0"
optional = true

[dependencies.creamui-theme]
version = "0.3.0"

[dependencies.creamui-theme-loader]
version = "0.3.0"
optional = true
default-features = false

[dependencies.creamui-theme-watch]
version = "0.3.0"
optional = true

[dependencies.creamui-tray]
version = "0.3.0"
optional = true

[dependencies.creamui-widgets]
version = "0.3.0"
optional = true

[dependencies.env_logger]
version = "0.11"
optional = true
default-features = false

[dependencies.log]
version = "0.4"

[dependencies.rustc-hash]
version = "2"

[dependencies.swash]
version = "0.2"

[dependencies.tiny-skia]
version = "0.11"

[dependencies.tracing]
version = "0.1"
optional = true

[dev-dependencies.creamui-widgets]
